name: Cargo Build & Test

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          # - beta
          # - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Start disposable SurrealDB
        run: docker run --detach --name surreal-test --publish 127.0.0.1:18000:8000 --env SURREAL_USER=deps-test --env SURREAL_PASS=deps-test surrealdb/surrealdb:v4.0.1 start --bind 0.0.0.0:8000 memory
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose
      - name: Test SurrealDB record access and persistence
        env:
          SURREALDB_TEST_HOST: 127.0.0.1:18000
          SURREALDB_TEST_USER: deps-test
          SURREALDB_TEST_PASSWORD: deps-test
        run: |
          cargo test --locked -p shared --test database -- --ignored
          cargo test --locked -p fetcher seen_links_fit_bounded_websocket_messages -- --ignored
      - name: Stop disposable SurrealDB
        if: always()
        run: docker rm --force surreal-test

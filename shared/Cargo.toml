[package]
name = "shared"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
async-openai = { version = "0.43.0", features = ["byot", "chat-completion"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
envy = "0.4.2"
maplit = "1.0.2"
log = "0.4.35"
nanohtml2text = "0.3.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = { version = "4.0.1", default-features = false, features = ["protocol-http", "rustls"] }
tiktoken-rs = "0.12.1"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

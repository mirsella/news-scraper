services:
  article_parser:
    restart: unless-stopped
    container_name: article_parser
    build:
      context: bun-article-parser
      dockerfile: dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8081"]
      retries: 3
      start_period: 10s
      timeout: 5s

  fetcher:
    container_name: fetcher
    restart: on-failure
    build:
      context: .
      dockerfile: cargo.dockerfile
      target: fetcher
    depends_on:
      surrealdb:
        condition: service_healthy
      article_parser:
        condition: service_started
    environment:
      ARTICLE_PARSER_URL: "http://article_parser:8081"
      SURREALDB_HOST: "surrealdb:8000"
      CHROME_HEADLESS: "true"
      RUST_LOG: "fetcher=debug"

  rater:
    container_name: rater
    restart: unless-stopped
    build:
      context: .
      dockerfile: cargo.dockerfile
      target: rater
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      RUST_LOG: "rater=debug"
      SURREALDB_HOST: "surrealdb:8000"

  surrealdb:
    container_name: surrealdb
    restart: unless-stopped
    image: surrealdb/surrealdb:v4.0.1
    env_file:
      - .env
    user: root
    environment:
      - SURREAL_NO_BANNER=true
      - SURREAL_CAPS_ALLOW_FUNC
      - SURREAL_USER=${DB_USER}
      - SURREAL_PASS=${DB_PASSWORD}
      - SURREAL_PATH=surrealkv:/data/news
      - SURREAL_BIND=0.0.0.0:8000
    command: start
    volumes:
      # Never open the legacy ./db directory with a newer server. See README migration steps.
      - ./db-v4:/data
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      retries: 3
      start_period: 30s
      timeout: 10s

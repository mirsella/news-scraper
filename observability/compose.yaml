services:
  monitor:
    image: local/news-observability:posthog-20261109
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monitor-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    logging:
      options:
        max-size: 10m
        max-file: "2"
volumes:
  monitor-state:

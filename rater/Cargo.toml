[package]
name = "rater"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync"] }
shared = { path = "../shared" }
log = "0.4.35"
env_logger = "0.11.11"
anyhow = "1.0.104"
serde_json = "1.0.154"
regex = "1.13.1"
async-openai = { version = "0.43.0", features = ["chat-completion"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
surrealdb = { version = "4.0.1", default-features = false, features = ["protocol-ws", "rustls"] }
futures = "0.3.34"

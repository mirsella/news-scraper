[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0.104"
automod = "1.0.17"
env_logger = "0.11.11"
futures = "0.3.34"
headless_chrome = { git = "https://github.com/mirsella/rust-headless-chrome", rev = "d885d30640f0520e5b905924a58cc72d153d7b71" }
log = "0.4.35"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"
shared = { path = "../shared" }
ureq = { version = "3.5.1", features = ["json"] }
surrealdb = { version = "4.0.1", default-features = false, features = ["protocol-http", "rustls"] }
serde_json = "1.0.154"
ctrlc = { version = "3.5.2", features = ["termination"] }
dateparser = "0.3.1"
